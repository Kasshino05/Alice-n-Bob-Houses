<!-- DETAILED VIEW MODAL -->
<div id="details-modal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>

    <h2 id="modal-title">Property Details</h2>
    <p id="modal-address">Address goes here</p>

    <div id="modal-body">
      <p id="modal-description">Detailed description of the property will appear here...</p>
      <!-- Open source Map Embedding -->
      <div class="map-container">
        <h3>Location Map</h3>
        <iframe
                id="modal-map"
                width="100%"
                height="250"
                src="https://www.openstreetmap.org/export/embed.html?bbox=11.3,55.3,11.4,55.4&layer=mapnik">
        </iframe>
      </div>

      <!-- NOTE to self, research this topic later -->
      <!-- VIEWING REQUEST FORM -->
      <section class="booking-form">
        <h3>Request a Viewing</h3>
        <form id="viewing-form" action="mailto:contact@aliceandbob.com" method="post" enctype="text/plain">
          <label for="full-name">Full Name:</label>
          <input type="text" id="full-name" name="Full Name" required>

          <label for="email">Email / Phone:</label>
          <input type="text" id="email" name="Contact Info" required>

          <label for="viewing-time">Preferred Viewing Time:</label>
          <input type="datetime-local" id="viewing-time" name="Preferred Time" required>

          <button type="submit">Send Viewing Request</button>
        </form>
      </section>
    </div>
  </div>
</div>
